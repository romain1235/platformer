<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini platformer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: darkblue;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <canvas width="960" height="720" id="canvas"></canvas>
    <script>
        let canvas = document.getElementById("canvas")
        let ctx = canvas.getContext("2d")
        let can_jump = false
        const thickness = 10
        function resize_canvas() {
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight
        }
        window.addEventListener('resize', resize_canvas);
        resize_canvas()
        const spawn = {
            x: 50,
            y: 0,
        }
        let player = {
            x: spawn.x,
            y: spawn.y,
            x_speed: 0,
            y_speed: 0,
            size: 60,
        }
        let keys = {
            left: false,
            right: false,
            up: false,
            down: false,
        }
        let camera = {
            x: spawn.x - canvas.width / 2 + player.size / 2,
            y: spawn.y - canvas.height / 2 + player.size / 2,
        }
        const platforms = [
            {
                x: 0,
                y: 100,
                w: 200,
                h: 500,
            },
            {
                x: 199,
                y: 150,
                w: 201,
                h: 500,
            },
            {
                x: 399,
                y: 50,
                w: 601,
                h: 500,
            },
            {
                x: 499,
                y: -200,
                w: 201,
                h: 50,
            },
            {
                x: 999,
                y: -700,
                w: 201,
                h: 1200,
            },
            {
                x: 800,
                y: -400,
                w: 201,
                h: 50,
            },
            {
                x: 499,
                y: -600,
                w: 201,
                h: 50,
            },
        ]
        /*orientation:
        1:up
        2:right
        3:down
        4:left
        */

        const spikes = [
            {
                x: 300,
                y: 150,
                size: 70,
                orientation: 1,
            },
            {
                x: 680,
                y: -600,
                size: 40,
                orientation: 1,
            },
        ]
        const checkpoints = [
            {
                x: 1100,
                y: -700,
                taken: false,
            },
        ]
        const enemies = [
            {
                x: 600,
                y: -50,
                size: 60,
                y_speed: 0,
                x_speed: 5,
                min_x: 400,
                max_x: 700,
            },
        ]
        function rotate_point(point, orientation) {
            if (orientation == 1) {
                return point
            } else if (orientation == 2) {
                return { x: 0 - point.y, y: 0 - point.x }
            } else if (orientation == 3) {
                return { x: 0 - point.x, y: 0 - point.y }
            } else {
                return { x: point.y, y: point.x }
            }
        }
        function touch_rect(rect) {
            return rect_touch_rect(player, rect)
        }
        function touch_screen(rect) {
            return rect.x + rect.w > 0 && rect.y + rect.h > 0 && rect.x < canvas.width && rect.y < canvas.height
        }
        function rect_touch_rect(rect1, rect2) {
            return rect1.x + rect1.size > rect2.x && rect1.x < rect2.x + rect2.w && rect1.y + rect1.size > rect2.y && rect1.y < rect2.y + rect2.h
        }
        function collide_platform(obj, platform) {
            if (rect_touch_rect(obj, platform)) {
                if (!(obj.y + obj.size - obj.y_speed > platform.y && obj.y - obj.y_speed < platform.y + platform.h)) {
                    if (obj.y_speed >= 0) {
                        obj.y = platform.y - obj.size
                        obj.y_speed = 0
                        if (obj == player) {
                            can_jump = true
                        }
                    } else {
                        obj.y = platform.y + platform.h
                        obj.y_speed = 0
                    }
                }
                if (!(obj.x + obj.size - obj.x_speed > platform.x && obj.x - obj.x_speed < platform.x + platform.w)) {
                    if (obj.x_speed > 0) {
                        obj.x = platform.x - obj.size
                        obj.x_speed = 0
                    } else {
                        obj.x = platform.x + platform.w
                        obj.x_speed = 0
                    }
                }
            }
        }
        function move_camera() {
            camera.x += ((player.x + player.size / 2) - (camera.x + canvas.width / 2)) / 8
            camera.y += ((player.y + player.size / 2) - (camera.y + canvas.height / 2)) / 8
        }
        function draw_grass(platform) {
            const x = platform.x - camera.x
            const y = platform.y - camera.y
            if (touch_screen({ x: x, y: y, w: platform.w, h: platform.h })) {
                ctx.beginPath()
                ctx.strokeStyle = "#00dd00"
                ctx.lineCap = 'round';
                ctx.lineWidth = thickness
                ctx.moveTo(x, y + thickness / 2)
                ctx.lineTo(x + platform.w, y + thickness / 2)
                ctx.stroke()
            }
        }
        function draw_dirt(platform) {
            const x = platform.x - camera.x
            const y = platform.y - camera.y
            if (touch_screen({ x: x, y: y, w: platform.w, h: platform.h })) {
                ctx.fillStyle = "#882200"
                ctx.fillRect(x, y + thickness, platform.w, platform.h - thickness)
            }
        }
        function draw_spike(spike) {
            const x = spike.x - camera.x
            const y = spike.y - camera.y
            let point
            ctx.beginPath()
            ctx.fillStyle = "#ff0000"
            point = rotate_point({ x: 0 - spike.size / 2.5, y: 0 }, spike.orientation)
            ctx.moveTo(x + point.x, y + point.y)
            point = rotate_point({ x: spike.size / 2.5, y: 0 }, spike.orientation)
            ctx.lineTo(x + point.x, y + point.y)
            point = rotate_point({ x: 0, y: 0 - spike.size }, spike.orientation)
            ctx.lineTo(x + point.x, y + point.y)
            ctx.fill()

        }
        function draw_checkpoint(checkpoint) {
            const x = checkpoint.x - camera.x
            const y = checkpoint.y - camera.y
            if (checkpoint.taken) {
                ctx.fillStyle = "green"
            } else {
                ctx.fillStyle = "red"
            }
            ctx.fillRect(x - 20, y - 60, 40, 40)
            ctx.beginPath()
            ctx.strokeStyle = "black"
            ctx.lineWidth = 10
            ctx.moveTo(x - 20, y)
            ctx.lineTo(x - 20, y - 60)
            ctx.stroke()
        }
        function draw_enemy(enemy) {
            ctx.fillRect(enemy.x - camera.x, enemy.y - camera.y, enemy.size, enemy.size)
        }
        function draw() {
            ctx.fillStyle = "#0099ff"
            ctx.fillRect(0, 0, canvas.width, canvas.height)
            ctx.fillStyle = "#ffd400"
            ctx.fillRect(player.x - camera.x, player.y - camera.y, player.size, player.size)
            for (let i = 0; i < checkpoints.length; i++) {
                const checkpoint = checkpoints[i]
                draw_checkpoint(checkpoint)
            }

            for (let i = 0; i < platforms.length; i++) {
                const platform = platforms[i]
                draw_grass(platform)
            }
            for (let i = 0; i < platforms.length; i++) {
                const platform = platforms[i]
                draw_dirt(platform)
            }
            for (let i = 0; i < spikes.length; i++) {
                const spike = spikes[i]
                draw_spike(spike)
            }
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i]
                draw_enemy(enemy)
            }

        }
        function update_enemy(enemy) {
            enemy.y_speed += 1.5
            enemy.y += enemy.y_speed
            enemy.x += enemy.x_speed
            const last_speed_x = enemy.x_speed
            for (let i = 0; i < platforms.length; i++) {
                const platform = platforms[i]
                collide_platform(enemy, platform)
            }
            if (enemy.x_speed == 0) {
                enemy.x_speed = 0 - last_speed_x
            }
            if (enemy.x > enemy.max_x) {
                enemy.x_speed = 0 - enemy.x_speed
                enemy.x = enemy.max_x
            }
            if (enemy.x < enemy.min_x) {
                enemy.x_speed = 0 - enemy.x_speed
                enemy.x = enemy.min_x
            }
        }
        function update() {
            if (keys.right) {
                player.x_speed += 1.5
            }
            if (keys.left) {
                player.x_speed -= 1.5
            }
            player.y_speed += 1.5
            player.y += player.y_speed
            can_jump = false

            player.x_speed *= 0.9
            player.x += player.x_speed
            for (let i = 0; i < platforms.length; i++) {
                const platform = platforms[i]
                collide_platform(player, platform)
            }
            for (let i = 0; i < spikes.length; i++) {
                const spike = spikes[i]
                const point = rotate_point({ x: 0 - spike.size / 4, y: 0 - spike.size * 0.5 }, spike.orientation)
                const size = rotate_point({ x: spike.size / 2, y: spike.size * 0.5 }, spike.orientation)
                if (size.x < 0) {
                    point.x += size.x;
                    size.x = -size.x;
                }
                if (size.y < 0) {
                    point.y += size.y;
                    size.y = -size.y;
                }
                if (touch_rect({ x: spike.x + point.x, y: spike.y + point.y, w: size.x, h: size.y })) {
                    player.x = spawn.x
                    player.y = spawn.y
                    player.x_speed = 0
                    player.y_speed = 0
                }
            }
            for (let i = 0; i < checkpoints.length; i++) {
                const checkpoint = checkpoints[i]
                if (touch_rect({ x: checkpoint.x - 20, y: checkpoint.y - 60, w: 40, h: 60 }) && !checkpoint.taken) {
                    checkpoint.taken = true
                    spawn.x = checkpoint.x - player.size / 2
                    spawn.y = checkpoint.y - player.size
                }
            }
            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i]
                update_enemy(enemy)
            }

            for (let i = 0; i < enemies.length; i++) {
                const enemy = enemies[i]
                if (touch_rect({ x: enemy.x, y: enemy.y, w: enemy.size, h: enemy.size })) {
                    if (!(player.y + player.size - player.y_speed > enemy.y && player.y - player.y_speed < enemy.y + enemy.size)) {
                        enemies.splice(i, 1)
                        i--
                    } else {
                        player.x = spawn.x
                        player.y = spawn.y
                        player.x_speed = 0
                        player.y_speed = 0
                    }
                }
            }

            if (can_jump && keys.up) {
                player.y_speed = -30
            }
            move_camera()
            draw()
            requestAnimationFrame(update)
        }
        requestAnimationFrame(update)
        document.addEventListener("keydown", function (event) {
            if (event.key == "ArrowRight") {
                keys.right = true
            }
            if (event.key == "ArrowLeft") {
                keys.left = true
            }
            if (event.key == "ArrowUp" || event.key == " ") {
                keys.up = true
            }
            if (event.key == "ArrowDown") {
                keys.down = true
            }

        });
        document.addEventListener("keyup", function (event) {
            if (event.key == "ArrowRight") {
                keys.right = false
            }
            if (event.key == "ArrowLeft") {
                keys.left = false
            }
            if (event.key == "ArrowUp" || event.key == " ") {
                keys.up = false
            }
            if (event.key == "ArrowDown") {
                keys.down = false
            }

        });

    </script>
</body>

</html>
